name: Release Docker

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/ppc64le
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/telegram_restricted_media_downloader:${{ github.ref_name }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/telegram_restricted_media_downloader:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
