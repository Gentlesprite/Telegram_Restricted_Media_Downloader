<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRMD</title>
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
<header>
    <div class="topbar">
        <div class="brand">
            <span class="logo">TRMD</span>
        </div>
        <div class="status">
            <span class="dot" id="dot"></span>
            <span id="statusText">空闲 · 等待任务</span>
        </div>
    </div>
</header>

<div class="offline" id="offline">已与程序断开连接，请确认程序是否仍在运行。</div>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <button class="side-item active" data-section="download" type="button">下载</button>
        <button class="side-item" data-section="upload" type="button">上传</button>
        <button class="side-item" data-section="listener" type="button">监听</button>
    </aside>

    <main class="content">
        <div id="downloadSummary">
            <div class="panel overall">
                <div class="overall-top">
                    <span class="label">总进度</span>
                    <span class="big" id="overallPercent">0%</span>
                    <span class="muted" id="overallInfo">0.00B / 0.00B</span>
                    <span class="muted" id="overallExtra">暂无速度</span>
                </div>
                <div class="track track-lg">
                    <div class="fill" id="overallFill"></div>
                </div>
            </div>
            <div class="stat" id="stat"></div>
        </div>

        <div id="uploadSummary" hidden>
            <div class="panel overall">
                <div class="overall-top">
                    <span class="label">总进度</span>
                    <span class="big" id="uploadPercent">0%</span>
                    <span class="muted" id="uploadInfo">0.00B / 0.00B</span>
                    <span class="muted" id="uploadExtra">暂无速度</span>
                </div>
                <div class="track track-lg">
                    <div class="fill" id="uploadFill"></div>
                </div>
            </div>
            <div class="stat" id="uploadStat"></div>
        </div>

        <div class="page" id="page-download">
            <div class="section-head">
                <span class="gcount">进行中 <b id="badgeDownload">0</b> 个任务</span>
                <button class="toggle" id="toggleAll" type="button">全部折叠</button>
            </div>
            <div class="list">
                <div class="list-head">
                    <span id="headName">频道</span>
                    <span>进度</span>
                    <span class="h-size" id="headSize">完成 / 总数</span>
                    <span class="h-speed">速度</span>
                    <span class="h-remain">剩余时间</span>
                    <span class="h-status">状态</span>
                </div>
                <div id="download"></div>
            </div>
        </div>

        <div class="page" id="page-upload" hidden>
            <div class="section-head">
                <span class="gcount">进行中 <b id="badgeUpload">0</b> 个任务</span>
                <button class="toggle" id="toggleUpload" type="button">全部折叠</button>
            </div>
            <div class="list">
                <div class="list-head">
                    <span class="h-name">频道</span>
                    <span>进度</span>
                    <span class="h-size">完成 / 总数</span>
                    <span class="h-speed">速度</span>
                    <span class="h-remain">剩余时间</span>
                    <span class="h-status">状态</span>
                </div>
                <div id="upload"></div>
            </div>
        </div>

        <div class="page" id="page-listener" hidden>
            <div class="tabs" id="listenTabs">
                <button class="tab active" data-listen="forward" type="button">转发</button>
                <button class="tab" data-listen="download" type="button">下载</button>
            </div>
            <div class="list listen-two" id="listenForwardBox">
                <div class="list-head">
                    <span>监听频道</span>
                    <span>转发频道</span>
                    <span class="h-action">操作</span>
                </div>
                <div id="listenForward"></div>
            </div>
            <div class="list listen-one" id="listenDownloadBox" hidden>
                <div class="list-head">
                    <span>监听频道</span>
                    <span class="h-action">操作</span>
                </div>
                <div id="listenDownload"></div>
            </div>
        </div>
    </main>
</div>
</div>
<script src="js/app.js"></script>
</body>
</html>
