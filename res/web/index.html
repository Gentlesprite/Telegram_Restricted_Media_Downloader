<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRMD 网页面板</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header>
    <div class="topbar">
        <div class="brand">
            <span class="logo">TRMD</span>
            <h1>下载器</h1>
        </div>
        <div class="status">
            <span class="dot" id="dot"></span>
            <span id="statusText">空闲 · 等待任务</span>
        </div>
    </div>
</header>

<div class="offline" id="offline">已与程序断开连接，请确认程序是否仍在运行。</div>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <button class="side-item active" data-section="download" type="button">下载</button>
        <button class="side-item" data-section="upload" type="button">上传</button>
    </aside>

    <main class="content">
        <div id="downloadSummary">
            <div class="panel overall">
                <div class="overall-top">
                    <span class="label">总进度</span>
                    <span class="big" id="overallPercent">0%</span>
                    <span class="muted" id="overallInfo">0.00B / 0.00B</span>
                    <span class="muted" id="overallExtra">暂无速度</span>
                </div>
                <div class="track track-lg">
                    <div class="fill" id="overallFill"></div>
                </div>
            </div>
            <div class="stat" id="stat"></div>
        </div>

        <nav class="tabs" id="tabs">
            <button class="tab active" data-section="download" data-tab="running" type="button">下载中<b class="badge" id="badgeRunning">0</b></button>
            <button class="tab" data-section="download" data-tab="done" type="button">已完成<b class="badge" id="badgeDone">0</b></button>
            <button class="tab" data-section="download" data-tab="links" type="button">链接进度<b class="badge" id="badgeLinks">0</b></button>
            <button class="tab" data-section="upload" data-tab="uploading" type="button" hidden>上传中<b class="badge" id="badgeUploading">0</b></button>
            <button class="tab" data-section="upload" data-tab="uploaded" type="button" hidden>已完成<b class="badge" id="badgeUploaded">0</b></button>
            <button class="tab" data-section="upload" data-tab="upload_failed" type="button" hidden>失败<b class="badge" id="badgeUploadFailed">0</b></button>
        </nav>

        <div class="page" id="page-running">
            <div class="section-head">
                <h2>下载中</h2>
                <button class="toggle" id="toggleAll" type="button">全部折叠</button>
            </div>
            <div class="list">
                <div class="list-head">
                    <span>名称</span>
                    <span>进度</span>
                    <span class="h-size">大小</span>
                    <span class="h-speed">速度</span>
                    <span class="h-remain">剩余时间</span>
                    <span class="h-status">状态</span>
                </div>
                <div id="running"></div>
            </div>
        </div>

        <div class="page" id="page-done" hidden>
            <div class="list">
                <div class="list-head">
                    <span>名称</span>
                    <span>进度</span>
                    <span class="h-size">大小</span>
                    <span class="h-speed">速度</span>
                    <span class="h-remain">剩余时间</span>
                    <span class="h-status">状态</span>
                </div>
                <div id="done"></div>
            </div>
        </div>

        <div class="page" id="page-links" hidden>
            <div class="list">
                <div class="list-head">
                    <span>链接</span>
                    <span>进度</span>
                    <span class="h-size">完成/总数</span>
                    <span class="h-speed">速度</span>
                    <span class="h-remain">剩余时间</span>
                    <span class="h-status">状态</span>
                </div>
                <div id="links"></div>
            </div>
        </div>

        <div class="page" id="page-uploading" hidden>
            <div class="list" id="uploading"></div>
        </div>

        <div class="page" id="page-uploaded" hidden>
            <div class="list" id="uploaded"></div>
        </div>

        <div class="page" id="page-upload_failed" hidden>
            <div class="list" id="upload_failed"></div>
        </div>
    </main>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
